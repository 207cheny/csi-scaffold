# Controller 平面：Deployment 运行，负责「卷的生命周期管理」（供应/删除/扩容）。
# 与 node 平面分离部署是 CSI 的标准拓扑：
#   controller：通常 1~3 副本（多副本靠 leader election 选主），不需要特权；
#   node：      DaemonSet 每节点一份，需要特权 + 宿主机挂载命名空间。
#
# 本清单由 4 个容器组成：
#   csi-provisioner：监听 PVC，调用 CreateVolume/DeleteVolume
#   csi-resizer：    监听 PVC 扩容请求，调用 ControllerExpandVolume
#   livenessprobe：  周期性调用 Probe，异常时重启容器（由 kubelet 执行）
#   csi-scaffold：   driver 本体（业务容器）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-scaffold-controller
  namespace: csi-scaffold
  labels:
    app: csi-scaffold-controller
spec:
  replicas: 1 # 多副本时 sidecar 自动通过 leases 选主，但需评估后端并发能力
  selector:
    matchLabels:
      app: csi-scaffold-controller
  template:
    metadata:
      labels:
        app: csi-scaffold-controller
    spec:
      serviceAccountName: csi-scaffold-controller-sa
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
          args:
            - --csi-address=$(ADDRESS)
            - --leader-election
            - --leader-election-namespace=csi-scaffold
            - --timeout=60s
            - --v=2
            # 文件存储 PVC 创建即可用，无需等待 pod 选定节点
            - --immediate-topology=false
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v1.13.2
          args:
            - --csi-address=$(ADDRESS)
            - --leader-election
            - --leader-election-namespace=csi-scaffold
            - --v=2
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
        - name: livenessprobe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.15.0
          args:
            - --csi-address=/csi/csi.sock
            - --health-port=9808
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-scaffold
          image: registry.example.com/library/csi-scaffold:v0.1.0 # make deploy 会替换
          args:
            - --drivername=scaffold.csi.example.com
            - --endpoint=unix:///csi/csi.sock
            - --nodeid=$(NODE_ID)      # controller 副本不感知节点，填占位值即可
            - --backend=nfs
            - --backend-config=/etc/csi-backend/config.json
            - --v=4
          env:
            - name: NODE_ID
              value: controller # node 服务在 DaemonSet 中注入真实 nodeName
          ports:
            - name: healthz
              containerPort: 9808
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            # controller 侧需要临时挂载 nfs 根 share 做 mkdir，必须特权。
            # 若后端走 API（如云盘 OpenAPI）而非本地挂载，可去掉特权。
            privileged: true
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: backend-config
              mountPath: /etc/csi-backend
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 60Mi
      volumes:
        # emptyDir 承载 unix socket，同 pod 内容器共享。
        - name: socket-dir
          emptyDir: {}
        - name: backend-config
          configMap:
            name: csi-scaffold-backend-config
